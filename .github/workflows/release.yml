# Builds the static reprinter-web binaries (amd64, arm64, armhf) and attaches
# them to the GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Run by hand (Actions -> release -> Run workflow) to build without releasing;
# the binaries are then kept as a workflow artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,arm-unknown-linux-musleabihf

      - name: Unit tests
        run: cd web && cargo test --locked

      - name: Build
        run: web/build-release.sh

      - name: Smoke test (amd64)
        run: |
          web/dist/reprinter-web-amd64 --version
          web/dist/reprinter-web-amd64 install --list

      - uses: actions/upload-artifact@v4
        with:
          name: reprinter-web
          path: web/dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web/dist/reprinter-web-amd64
            web/dist/reprinter-web-arm64
            web/dist/reprinter-web-armhf
            web/dist/SHA256SUMS
