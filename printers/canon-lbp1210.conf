# shellcheck shell=bash disable=SC2034 # fields are read by install.sh
# Canon LASER SHOT LBP-1210: CAPT v1 host-based laser, EP-25 cartridge, 14 ppm.
# Printer notes and troubleshooting: docs/printers/canon-lbp1210.md
#
# Profile format: docs/adding-a-printer.md

PRINTER_MODEL="Canon LASER SHOT LBP-1210"

# lsusb IDs (vendor:product) used for auto-detection; space separated.
PRINTER_USB_IDS="04a9:2617"

# Module in drivers/ that installs the driver and provides the CUPS backend.
PRINTER_DRIVER="captppd"

# PPD name as listed by `lpinfo -m` once the driver is installed.
PRINTER_PPD="LBP1210CAPTPPD.ppd"

# Picks this printer out of `lpinfo -v`. captppd builds the URI from the model
# string the printer reports, e.g. captusb://Canon/LBP1210?drv=capt&serial=...
PRINTER_URI_REGEX='^captusb://[^/]+/[^?]*LBP-?1210[?]'

# Default CUPS queue name (override with --queue).
PRINTER_QUEUE="LBP1210"

# Extra `lpadmin -o` defaults, space separated. captppd only implements 600 dpi.
PRINTER_OPTIONS="Resolution=600dpi"
