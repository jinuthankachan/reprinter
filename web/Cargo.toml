[package]
name = "reprinter-web"
version = "0.2.0"
edition = "2024"
# Debian 13 ships rustc 1.85, so it can build this without rustup.
rust-version = "1.85"
description = "Web interface for a reprinter CUPS print server: print files and manage printers from a browser"
publish = false

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"

[profile.release]
strip = true
