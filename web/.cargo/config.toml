# Static (musl) builds that run on any Linux distribution and release,
# linked with the rust-lld that ships with Rust, so no cross toolchain is
# needed:  rustup target add <target>; cargo build --release --target <target>
# See build-release.sh.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.arm-unknown-linux-musleabihf]
linker = "rust-lld"
